<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Habits</title>
  <style>
    /* Theme Presets */
    :root[data-theme="blue"] {
      --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --badge-bg: rgba(59, 130, 246, 0.2);
    }
    :root[data-theme="pink"] {
      --bg: #1f0b18; --card: #2e1225; --accent: #ec4899; --text: #fdf2f8; --muted: #f472b6; --border: #501d40; --badge-bg: rgba(236, 72, 153, 0.2);
    }
    :root[data-theme="olive"] {
      --bg: #141a13; --card: #1f271d; --accent: #658354; --text: #f3f6f2; --muted: #a3b899; --border: #354232; --badge-bg: rgba(101, 131, 84, 0.2);
    }
    :root[data-theme="red"] {
      --bg: #1a0909; --card: #2b1212; --accent: #ef4444; --text: #fef2f2; --muted: #f87171; --border: #451a1a; --badge-bg: rgba(239, 68, 68, 0.2);
    }
    :root[data-theme="black"] {
      --bg: #000000; --card: #121212; --accent: #ffffff; --text: #ffffff; --muted: #888888; --border: #262626; --badge-bg: rgba(255, 255, 255, 0.15);
    }
    :root[data-theme="grey"] {
      --bg: #f3f4f6; --card: #ffffff; --accent: #4b5563; --text: #111827; --muted: #6b7280; --border: #e5e7eb; --badge-bg: rgba(107, 114, 128, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
    
    /* Header & Hamburger Menu */
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; position: relative; }
    h1 { font-size: 1.6rem; font-weight: 700; }
    p.date { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

    .menu-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 1.4rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    
    .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; margin-top: 8px; overflow: hidden; }
    .dropdown-menu.active { display: block; }
    .dropdown-item { width: 100%; padding: 12px 16px; text-align: left; background: none; border: none; color: var(--text); font-size: 0.95rem; font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--border); }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.active { background: var(--accent); color: white; }

    /* Views */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Inputs & Buttons */
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; outline: none; }
    button.add-btn { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Lists */
    .habit-list { display: flex; flex-direction: column; gap: 12px; }
    .habit-card { background: var(--card); padding: 14px; border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; transition: background 0.3s; }
    .habit-main { display: flex; align-items: center; justify-content: space-between; }
    .habit-left { display: flex; align-items: center; gap: 12px; }
    .habit-checkbox { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    .habit-name { font-size: 1rem; font-weight: 500; }
    .habit-name.completed { text-decoration: line-through; color: var(--muted); opacity: 0.7; }
    
    /* Analytics & Badges */
    .stats-row { display: flex; gap: 6px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
    .stat-badge { background: var(--badge-bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; font-weight: 600; color: var(--text); }
    .stat-badge.streak { background: var(--accent); color: white; border: none; }

    .delete-btn { background: none; border: none; color: #ef4444; font-size: 1.4rem; cursor: pointer; padding: 0 8px; line-height: 1; }
    .empty-state { text-align: center; color: var(--muted); margin-top: 40px; font-size: 0.9rem; }

    /* Settings View */
    .settings-group { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .settings-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .theme-btn { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer; text-align: center; }
    .theme-btn.active { border: 2px solid var(--accent); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 id="viewTitle">Today</h1>
      <p class="date" id="currentDate"></p>
    </div>
    <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>
    
    <div class="dropdown-menu" id="dropdownMenu">
      <button class="dropdown-item active" id="itemToday" onclick="navigate('today', 'Today')">Today</button>
      <button class="dropdown-item" id="itemManage" onclick="navigate('manage', 'Manage Habits')">Manage Habits</button>
      <button class="dropdown-item" id="itemSettings" onclick="navigate('settings', 'Settings')">Settings</button>
    </div>
  </header>

  <!-- TODAY VIEW -->
  <div id="todayView" class="tab-content active">
    <div class="habit-list" id="todayList"></div>
  </div>

  <!-- MANAGE VIEW -->
  <div id="manageView" class="tab-content">
    <div class="input-group">
      <input type="text" id="habitInput" placeholder="Add a new habit..." />
      <button class="add-btn" id="addBtn">Add</button>
    </div>
    <div class="habit-list" id="manageList"></div>
  </div>

  <!-- SETTINGS VIEW -->
  <div id="settingsView" class="tab-content">
    <div class="settings-group">
      <div class="settings-title">Color Theme</div>
      <div class="theme-grid">
        <button class="theme-btn" onclick="setTheme('blue')">Dark Blue</button>
        <button class="theme-btn" onclick="setTheme('pink')">Pink</button>
        <button class="theme-btn" onclick="setTheme('olive')">Olive</button>
        <button class="theme-btn" onclick="setTheme('red')">Red</button>
        <button class="theme-btn" onclick="setTheme('black')">Black</button>
        <button class="theme-btn" onclick="setTheme('grey')">Grey / Light</button>
      </div>
    </div>
  </div>

  <script>
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getDaysInCurrentMonth() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    }

    let habits = [];
    try {
      habits = JSON.parse(localStorage.getItem('my_habits')) || [];
    } catch (e) {
      habits = [];
    }

    // Load Theme Preference
    const savedTheme = localStorage.getItem('my_theme') || 'olive';
    setTheme(savedTheme);

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'short', day: 'numeric'
    });

    function save() {
      localStorage.setItem('my_habits', JSON.stringify(habits));
    }

    /* MENU & NAVIGATION */
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('active');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('dropdownMenu');
      const btn = document.querySelector('.menu-btn');
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('active');
      }
    });

    function navigate(view, title) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById('viewTitle').textContent = title;
      document.getElementById('dropdownMenu').classList.remove('active');

      if (view === 'today') {
        document.getElementById('todayView').classList.add('active');
        document.getElementById('itemToday').classList.add('active');
        renderToday();
      } else if (view === 'manage') {
        document.getElementById('manageView').classList.add('active');
        document.getElementById('itemManage').classList.add('active');
        renderManage();
      } else if (view === 'settings') {
        document.getElementById('settingsView').classList.add('active');
        document.getElementById('itemSettings').classList.add('active');
      }
    }

    /* THEME SYSTEM */
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('my_theme', theme);
      
      // Update active state in theme buttons
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${theme}'`));
      });
    }

    /* STATS & TODAY VIEW */
    function calculateStats(history, createdAt) {
      const todayStr = getTodayString();
      const today = new Date(todayStr);
      const created = new Date(createdAt || todayStr);
      
      const totalDaysActive = Math.max(1, Math.floor((today - created) / (1000 * 60 * 60 * 24)) + 1);

      let streak = 0;
      let checkDate = new Date(today);
      if (!history.includes(todayStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
      }
      
      while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (history.includes(dateStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }

      function countInRange(days) {
        return history.filter(dStr => {
          const d = new Date(dStr);
          const diffDays = (today - d) / (1000 * 60 * 60 * 24);
          return diffDays >= 0 && diffDays < days;
        }).length;
      }

      const daysInMonth = getDaysInCurrentMonth();

      return {
        streak,
        week: `${countInRange(7)}/${Math.min(7, totalDaysActive)}`,
        month: `${countInRange(daysInMonth)}/${Math.min(daysInMonth, totalDaysActive)}`,
        year: `${countInRange(365)}/${Math.min(365, totalDaysActive)}`
      };
    }

    function toggleHabit(id) {
      const today = getTodayString();
      habits = habits.map(h => {
        if (h.id === id) {
          let history = h.history || [];
          if (history.includes(today)) {
            history = history.filter(d => d !== today);
          } else {
            history.push(today);
          }
          return { ...h, history };
        }
        return h;
      });
      save();
      renderToday();
    }

    function renderToday() {
      const todayList = document.getElementById('todayList');
      const today = getTodayString();
      todayList.innerHTML = '';

      if (habits.length === 0) {
        todayList.innerHTML = '<p class="empty-state">No habits set up yet. Tap <b>&#9776;</b> and go to <b>Manage Habits</b> to add some!</p>';
        return;
      }

      habits.forEach(h => {
        const history = h.history || [];
        const isChecked = history.includes(today);
        const stats = calculateStats(history, h.createdAt);

        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-main">
            <div class="habit-left">
              <input type="checkbox" class="habit-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${h.id})">
              <span class="habit-name ${isChecked ? 'completed' : ''}">${h.name}</span>
            </div>
          </div>
          <div class="stats-row">
            <span class="stat-badge streak">🔥 ${stats.streak} day streak</span>
            <span class="stat-badge">7d: ${stats.week}</span>
            <span class="stat-badge">30d: ${stats.month}</span>
            <span class="stat-badge">365d: ${stats.year}</span>
          </div>
        `;
        todayList.appendChild(card);
      });
    }

    /* MANAGE VIEW */
    function addHabit() {
      const input = document.getElementById('habitInput');
      const name = input.value.trim();
      if (!name) return;
      habits.push({
        id: Date.now(),
        name: name,
        createdAt: getTodayString(),
        history: []
      });
      input.value = '';
      save();
      renderManage();
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id !== id);
      save();
      renderManage();
    }

    function renderManage() {
      const manageList = document.getElementById('manageList');
      manageList.innerHTML = '';

      if (habits.length === 0) {
        manageList.innerHTML = '<p class="empty-state">Your habit list is empty. Type a habit above to start.</p>';
        return;
      }

      habits.forEach(h => {
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-main">
            <span class="habit-name">${h.name}</span>
            <button class="delete-btn" onclick="deleteHabit(${h.id})">&times;</button>
          </div>
        `;
        manageList.appendChild(card);
      });
    }

    document.getElementById('addBtn').onclick = addHabit;
    document.getElementById('habitInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addHabit();
    });

    renderToday();
  </script>
</body>
</html>
