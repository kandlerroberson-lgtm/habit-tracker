<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteorological Calendar Heatmap App</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: rgba(0, 0, 0, 0.12);
      --accent-color: #d90429;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Application Header */
    .app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .app-header span {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Main Workspace Layout */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
      flex-grow: 1;
    }

    @media (max-width: 850px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Primary Card: Calendar View */
    .calendar-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .calendar-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .calendar-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 7 / 5;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    /* Canvas Rendering Background */
    #heatCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(24px) saturate(1.2);
      transform: scale(1.08);
      pointer-events: none;
    }

    /* Interactive Calendar Grid Overlay */
    .calendar-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(5, 1fr);
      z-index: 2;
    }

    .day-cell {
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell:nth-last-child(-n+7) { border-bottom: none; }

    .day-cell:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .date-num {
      font-size: 0.85rem;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .val-num {
      font-size: 0.75rem;
      font-weight: 600;
      align-self: flex-end;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* Sidebar / Controls Panel */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .panel h3 {
      font-size: 0.95rem;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .control-group input[type="range"] {
      width: 100%;
    }

    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
    }

    .stat-row strong {
      color: var(--text-main);
    }

    /* Heat Map Legend Bar */
    .legend-bar {
      height: 10px;
      border-radius: 5px;
      margin: 8px 0;
      background: linear-gradient(to right, 
        #ffffff 0%, 
        #ffeea1 25%, 
        #ff9900 50%, 
        #d90429 75%, 
        #4a000a 100%
      );
      border: 1px solid var(--border-color);
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Monthly Thermal Analysis</h1>
    <span>Meteorological View</span>
  </header>

  <div class="app-container">
    <!-- Calendar View Block -->
    <main class="calendar-card">
      <div class="calendar-title-bar">
        <h2>October 2026</h2>
      </div>

      <div class="day-headers">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div class="calendar-viewport">
        <canvas id="heatCanvas"></canvas>
        <div class="calendar-grid" id="grid"></div>
      </div>
    </main>

    <!-- Sidebar Control & Stats Panel -->
    <aside class="sidebar">
      <div class="panel">
        <h3>Visualization Controls</h3>
        <div class="control-group">
          <label>Blur Intensity <span id="blurVal">24px</span></label>
          <input type="range" id="blurInput" min="5" max="40" value="24">
        </div>
      </div>

      <div class="panel">
        <h3>Monthly Summary</h3>
        <div class="stats-list">
          <div class="stat-row"><span>Peak Hotspot:</span><strong id="statMax">100%</strong></div>
          <div class="stat-row"><span>Lowest Day:</span><strong id="statMin">0%</strong></div>
          <div class="stat-row"><span>Monthly Average:</span><strong id="statAvg">37%</strong></div>
        </div>
      </div>

      <div class="panel">
        <h3>Color Scale</h3>
        <div class="legend-bar"></div>
        <div class="legend-labels">
          <span>0% (White)</span>
          <span>50% (Orange)</span>
          <span>100% (Dark Red)</span>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // 35 cells (7 days x 5 weeks) representing the month layout
    const dayValues = [
      10,  15,  25,  40,  65,  85,  95,
      05,  20,  30,  50,  70,  90, 100,
      00,  10,  20,  45,  60,  80,  75,
      05,  15,  35,  55,  70,  60,  40,
      00,  05,  10,  20,  30,  25,  10
    ];

    const COLS = 7;
    const ROWS = 5;

    // Color Interpolation (White -> Yellow -> Orange -> Red -> Dark Red)
    function getColorForValue(val) {
      const norm = Math.max(0, Math.min(100, val)) / 100;
      const stops = [
        { p: 0.00, r: 255, g: 255, b: 255 }, // White
        { p: 0.25, r: 255, g: 238, b: 161 }, // Yellow
        { p: 0.50, r: 255, g: 153, b: 0   }, // Orange
        { p: 0.75, r: 217, g: 4,   b: 41  }, // Red
        { p: 1.00, r: 74,  g: 0,   b: 10  }  // Dark Red
      ];

      let lower = stops[0], upper = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (norm >= stops[i].p && norm <= stops[i + 1].p) {
          lower = stops[i];
          upper = stops[i + 1];
          break;
        }
      }

      const factor = (upper.p - lower.p) === 0 ? 0 : (norm - lower.p) / (upper.p - lower.p);
      return {
        r: Math.round(lower.r + factor * (upper.r - lower.r)),
        g: Math.round(lower.g + factor * (upper.g - lower.g)),
        b: Math.round(lower.b + factor * (upper.b - lower.b))
      };
    }

    function renderHeatmap() {
      const canvas = document.getElementById('heatCanvas');
      const ctx = canvas.getContext('2d');
      const container = canvas.parentElement;

      const width = container.clientWidth;
      const height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      const cellW = width / COLS;
      const cellH = height / ROWS;
      const radius = Math.max(cellW, cellH) * 1.3;

      dayValues.forEach((val, idx) => {
        const col = idx % COLS;
        const row = Math.floor(idx / COLS);
        const centerX = col * cellW + cellW / 2;
        const centerY = row * cellH + cellH / 2;

        const color = getColorForValue(val);
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);

        gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.9)`);
        gradient.addColorStop(0.7, `rgba(${color.r}, ${color.g}, ${color.b}, 0.4)`);
        gradient.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      dayValues.forEach((val, idx) => {
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';

        const dateNum = document.createElement('span');
        dateNum.className = 'date-num';
        dateNum.textContent = idx + 1 <= 31 ? idx + 1 : '';

        const valNum = document.createElement('span');
        valNum.className = 'val-num';
        valNum.textContent = idx + 1 <= 31 ? `${val}%` : '';

        dayCell.appendChild(dateNum);
        dayCell.appendChild(valNum);
        grid.appendChild(dayCell);
      });
    }

    function calculateStats() {
      const validVals = dayValues.slice(0, 31);
      const max = Math.max(...validVals);
      const min = Math.min(...validVals);
      const avg = Math.round(validVals.reduce((a, b) => a + b, 0) / validVals.length);

      document.getElementById('statMax').textContent = `${max}%`;
      document.getElementById('statMin').textContent = `${min}%`;
      document.getElementById('statAvg').textContent = `${avg}%`;
    }

    // Dynamic Control Event Handlers
    const blurInput = document.getElementById('blurInput');
    const blurVal = document.getElementById('blurVal');
    const canvas = document.getElementById('heatCanvas');

    blurInput.addEventListener('input', (e) => {
      const value = e.target.value;
      blurVal.textContent = `${value}px`;
      canvas.style.filter = `blur(${value}px) saturate(1.2)`;
    });

    window.addEventListener('load', () => {
      buildGrid();
      renderHeatmap();
      calculateStats();
    });

    window.addEventListener('resize', renderHeatmap);
  </script>
</body>
</html>
