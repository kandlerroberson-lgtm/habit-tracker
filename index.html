<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Habits</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { margin-bottom: 20px; }
    h1 { font-size: 1.6rem; font-weight: 700; }
    p.date { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

    /* Navigation Tabs */
    .nav { display: flex; background: var(--card); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; }
    .nav-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .nav-btn.active { background: var(--accent); color: white; }

    /* Views */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Manage Tab Input */
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; outline: none; }
    button.add-btn { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Lists */
    .habit-list { display: flex; flex-direction: column; gap: 10px; }
    .habit-card { background: var(--card); padding: 14px; border-radius: 10px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .habit-left { display: flex; align-items: center; gap: 12px; }
    .habit-checkbox { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    .habit-name { font-size: 1rem; }
    .habit-name.completed { text-decoration: line-through; color: var(--muted); }
    .delete-btn { background: none; border: none; color: #ef4444; font-size: 1.4rem; cursor: pointer; padding: 0 8px; line-height: 1; }
    .empty-state { text-align: center; color: var(--muted); margin-top: 40px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Daily Tracker</h1>
    <p class="date" id="currentDate"></p>
  </header>

  <div class="nav">
    <button class="nav-btn active" id="tabToday" onclick="switchTab('today')">Today</button>
    <button class="nav-btn" id="tabManage" onclick="switchTab('manage')">Manage Habits</button>
  </div>

  <!-- TODAY VIEW -->
  <div id="todayView" class="tab-content active">
    <div class="habit-list" id="todayList"></div>
  </div>

  <!-- MANAGE VIEW -->
  <div id="manageView" class="tab-content">
    <div class="input-group">
      <input type="text" id="habitInput" placeholder="Add a new habit..." />
      <button class="add-btn" id="addBtn">Add</button>
    </div>
    <div class="habit-list" id="manageList"></div>
  </div>

  <script>
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    let habits = [];
    try {
      habits = JSON.parse(localStorage.getItem('my_habits')) || [];
    } catch (e) {
      habits = [];
    }

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'short', day: 'numeric'
    });

    function save() {
      localStorage.setItem('my_habits', JSON.stringify(habits));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      if (tab === 'today') {
        document.getElementById('todayView').classList.add('active');
        document.getElementById('tabToday').classList.add('active');
        renderToday();
      } else {
        document.getElementById('manageView').classList.add('active');
        document.getElementById('tabManage').classList.add('active');
        renderManage();
      }
    }

    /* TODAY VIEW LOGIC */
    function toggleHabit(id) {
      const today = getTodayString();
      habits = habits.map(h => {
        if (h.id === id) {
          return { ...h, lastCompleted: h.lastCompleted === today ? '' : today };
        }
        return h;
      });
      save();
      renderToday();
    }

    function renderToday() {
      const todayList = document.getElementById('todayList');
      const today = getTodayString();
      todayList.innerHTML = '';

      if (habits.length === 0) {
        todayList.innerHTML = '<p class="empty-state">No habits set up yet. Go to <b>Manage Habits</b> to add some!</p>';
        return;
      }

      habits.forEach(h => {
        const isChecked = h.lastCompleted === today;
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-left">
            <input type="checkbox" class="habit-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${h.id})">
            <span class="habit-name ${isChecked ? 'completed' : ''}">${h.name}</span>
          </div>
        `;
        todayList.appendChild(card);
      });
    }

    /* MANAGE VIEW LOGIC */
    function addHabit() {
      const input = document.getElementById('habitInput');
      const name = input.value.trim();
      if (!name) return;
      habits.push({ id: Date.now(), name: name, lastCompleted: '' });
      input.value = '';
      save();
      renderManage();
    }

    function deleteHabit(id) {
      habits = habits.filter(h => h.id !== id);
      save();
      renderManage();
    }

    function renderManage() {
      const manageList = document.getElementById('manageList');
      manageList.innerHTML = '';

      if (habits.length === 0) {
        manageList.innerHTML = '<p class="empty-state">Your habit list is empty. Type a habit above to start.</p>';
        return;
      }

      habits.forEach(h => {
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <span class="habit-name">${h.name}</span>
          <button class="delete-btn" onclick="deleteHabit(${h.id})">&times;</button>
        `;
        manageList.appendChild(card);
      });
    }

    document.getElementById('addBtn').onclick = addHabit;
    document.getElementById('habitInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addHabit();
    });

    // Initial load
    renderToday();
  </script>
</body>
</html>
